version: '3.8'

services:
  careflow-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careflow-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL:-jdbc:mysql://careflow-db:3306/careflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-careflow_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-careflow_password}
      - JWT_SECRET=${JWT_SECRET:-careflow_dev_secret_key_minimum_256_bits_length_for_hmac_sha512_security_string}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - STORAGE_PATH=/app/uploads
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      careflow-db:
        condition: service_healthy
    networks:
      - careflow-network

  careflow-db:
    image: mysql:8.0
    container_name: careflow-db
    restart: always
    environment:
      MYSQL_DATABASE: careflow_db
      MYSQL_USER: ${DATABASE_USERNAME:-careflow_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-careflow_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careflow-network

volumes:
  mysql_data:
  uploads_data:
  logs_data:

networks:
  careflow-network:
    driver: bridge
